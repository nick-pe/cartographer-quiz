<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cartographer — Daily World Geography Quiz</title>
    <meta name="description" content="A daily world geography quiz. Capitals, countries and flags across three levels, a shared Daily Challenge and Speed Runs. No account, no tracking." />
    <meta name="theme-color" content="#0f1629" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235B4BC4'/><path d='M50 8 L58 42 L92 50 L58 58 L50 92 L42 58 L8 50 L42 42 Z' fill='%23FFB829'/></svg>" />
    <script>
      // Apply the saved theme before first paint.
      try {
        var t = JSON.parse(localStorage.getItem("cartographer:v1") || "{}").settings?.theme;
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
